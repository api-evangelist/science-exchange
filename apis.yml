aid: science-exchange
name: Science Exchange
description: >-
  Science Exchange is an R&D supplier orchestration and procurement platform for life-sciences
  organizations. It runs a marketplace of 3,800+ pre-qualified scientific service providers under a
  single master service agreement, and streamlines supplier sourcing, onboarding, contracting,
  compliance, and payment. The platform integrates with ERP (SAP, Oracle, Workday), P2P (Ariba,
  Coupa), and SSO/SAML identity systems, and exposes a read-only Providers REST API (v1) that lets
  scientific-service suppliers pull their RFQs, quotes, services, facilities, line items, ratings,
  tags, and users. Founded in 2011 and headquartered in Palo Alto, California; backed by a16z,
  Index Ventures, and Union Square Ventures.

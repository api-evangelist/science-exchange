openapi: 3.2.0
info:
  title: Science Exchange Providers addresses Quote Versions API
  version: v1
  description: Read API for scientific-service providers (suppliers) on the Science Exchange R&D marketplace. Exposes a provider's RFQs, quotes, services, facilities, line items, ratings, tags, users and related resources. Derived from the first-party se_providers_api_client Ruby wrapper (github.com/scienceexchange/se_providers_api_client); authoritative reference at https://demo.scienceexchange.com/api-docs/providers.
  contact:
    name: Science Exchange Engineering
    email: devs@scienceexchange.com
    url: https://www.scienceexchange.com
  license:
    name: Proprietary
  x-derived-from: https://github.com/scienceexchange/se_providers_api_client
servers:
- url: https://www.scienceexchange.com/api/providers/v1
  description: Production
security:
- access_token: []
tags:
- name: quote_versions
  description: QuoteVersions resource.
paths:
  /quote_versions:
    get:
      operationId: getProvidersV1QuoteVersions
      summary: List quote versions
      description: Returns the collection of quote versions visible to the authenticated provider.
      tags:
      - quote_versions
      responses:
        '200':
          description: A list of quote versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Resource not found.
  /quote_versions/{id}:
    get:
      operationId: getProvidersV1QuoteVersionsId
      summary: Get a quote version
      description: Returns a single quote version by its identifier.
      tags:
      - quote_versions
      parameters:
      - name: id
        in: path
        required: true
        description: The quote version identifier.
        schema:
          type: string
      responses:
        '200':
          description: The requested quote version.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Quote version not found.
components:
  securitySchemes:
    access_token:
      type: apiKey
      in: query
      name: access_token
      description: Provider API key passed as the access_token query parameter on every request.

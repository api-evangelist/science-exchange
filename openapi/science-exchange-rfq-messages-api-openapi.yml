openapi: 3.2.0
info:
  title: Science Exchange Providers addresses Rfq Messages API
  version: v1
  description: Read API for scientific-service providers (suppliers) on the Science Exchange R&D marketplace. Exposes a provider's RFQs, quotes, services, facilities, line items, ratings, tags, users and related resources. Derived from the first-party se_providers_api_client Ruby wrapper (github.com/scienceexchange/se_providers_api_client); authoritative reference at https://demo.scienceexchange.com/api-docs/providers.
  contact:
    name: Science Exchange Engineering
    email: devs@scienceexchange.com
    url: https://www.scienceexchange.com
  license:
    name: Proprietary
  x-derived-from: https://github.com/scienceexchange/se_providers_api_client
servers:
- url: https://www.scienceexchange.com/api/providers/v1
  description: Production
security:
- access_token: []
tags:
- name: rfq_messages
  description: RFQMessages resource.
paths:
  /rfq_messages:
    get:
      operationId: getProvidersV1RFQMessages
      summary: List rfq messages
      description: Returns the collection of rfq messages visible to the authenticated provider.
      tags:
      - rfq_messages
      responses:
        '200':
          description: A list of rfq messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Resource not found.
  /rfq_messages/{id}:
    get:
      operationId: getProvidersV1RFQMessagesId
      summary: Get a RFQ message
      description: Returns a single RFQ message by its identifier.
      tags:
      - rfq_messages
      parameters:
      - name: id
        in: path
        required: true
        description: The RFQ message identifier.
        schema:
          type: string
      responses:
        '200':
          description: The requested RFQ message.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Rfq message not found.
components:
  securitySchemes:
    access_token:
      type: apiKey
      in: query
      name: access_token
      description: Provider API key passed as the access_token query parameter on every request.

openapi: 3.2.0
info:
  title: Science Exchange Providers addresses Tag Contexts API
  version: v1
  description: Read API for scientific-service providers (suppliers) on the Science Exchange R&D marketplace. Exposes a provider's RFQs, quotes, services, facilities, line items, ratings, tags, users and related resources. Derived from the first-party se_providers_api_client Ruby wrapper (github.com/scienceexchange/se_providers_api_client); authoritative reference at https://demo.scienceexchange.com/api-docs/providers.
  contact:
    name: Science Exchange Engineering
    email: devs@scienceexchange.com
    url: https://www.scienceexchange.com
  license:
    name: Proprietary
  x-derived-from: https://github.com/scienceexchange/se_providers_api_client
servers:
- url: https://www.scienceexchange.com/api/providers/v1
  description: Production
security:
- access_token: []
tags:
- name: tag_contexts
  description: TagContexts resource.
paths:
  /tag_contexts:
    get:
      operationId: getProvidersV1TagContexts
      summary: List tag contexts
      description: Returns the collection of tag contexts visible to the authenticated provider.
      tags:
      - tag_contexts
      responses:
        '200':
          description: A list of tag contexts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Resource not found.
  /tag_contexts/{id}:
    get:
      operationId: getProvidersV1TagContextsId
      summary: Get a tag context
      description: Returns a single tag context by its identifier.
      tags:
      - tag_contexts
      parameters:
      - name: id
        in: path
        required: true
        description: The tag context identifier.
        schema:
          type: string
      responses:
        '200':
          description: The requested tag context.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid access_token.
        '404':
          description: Tag context not found.
components:
  securitySchemes:
    access_token:
      type: apiKey
      in: query
      name: access_token
      description: Provider API key passed as the access_token query parameter on every request.
x-apievangelist:
  generated: '2026-07-21'
  method: derived
